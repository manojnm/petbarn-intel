[project]
name = "petbarn-intel"
version = "0.1.0"
description = "Petbarn agentic scraping and product intelligence platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.2",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "rapidfuzz>=3.9",
    "sqlglot>=25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "vaderSentiment>=3.3.2",
    "markdownify>=0.13",
    "tiktoken>=0.7",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-litellm>=0.1.4",
    "litellm>=1.48",
    "streamlit>=1.38",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "cachetools>=5.4",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
local-embeddings = ["fastembed>=0.3"]
observability = ["langfuse>=2.50"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
petbarn-intel = "petbarn_intel.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petbarn_intel"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = [
    "llm: makes real calls against the configured LLM deployment (agent evals) -- slower, needs credentials",
    "release: hard-assert adversarial gate, needs LLM credentials",
]
